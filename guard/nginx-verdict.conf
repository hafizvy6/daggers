# Daggers Guard — verdict server (Path B, VPS). Blocked domains resolve to this server's IP
# (GUARD_VERDICT_IP), so a phone that opens http://scam.example lands here and is redirected to
# the bilingual verdict page.
#
# HONEST LIMIT: most links are HTTPS. No server can present a valid certificate for a scam
# domain, so HTTPS visits show the browser's certificate warning — never the branded page.
# That is still a block (the scam never loads). Only plain-HTTP visits see the verdict page.
#
# Logging: access logs are off for the catch-all so visitors' addresses and the sites they
# tried are not stored. The verdict page counts one anonymous hit (hit=1) per device per site.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;

    # $host is the blocked domain the phone asked for.
    location / {
        return 302 https://daggers.example.org/verdict?domain=$host&hit=1;
    }
}

# HTTPS catch-all: refuses the TLS handshake instead of serving a wrong certificate.
# (Browsers show a connection error / certificate warning — the scam page never loads.)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;          # nginx ≥ 1.19.4
}

# The Daggers app itself (real certificate for YOUR domain).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daggers.example.org;
    ssl_certificate     /etc/letsencrypt/live/daggers.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daggers.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # set TRUST_PROXY_HEADERS=1
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;            # SSE (/api/stream)
    }
}
