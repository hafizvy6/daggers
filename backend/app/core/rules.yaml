# Daggers detection rules — DATA, not code. Edit here (no code change needed); restart or the next
# process start picks it up. Every list only describes patterns; none of them makes a site SAFE.
# Loaded by backend/app/core/rules.py. Validated at load (a broken file stops start-up loudly).

# Low-cost top-level domains frequently used for throw-away scam sites (weak signal, +0.15).
risky_tlds: [top, xyz, icu, click, live, cfd, rest, sbs, shop, online, site, fun, buzz, work, loan, gq, cf, tk, ml, ga]

# Prize / giveaway wording (used with a money amount to flag offers on otherwise approved pages).
giveaway_words:
  en: [giveaway, give-away, giving away, lottery, prize, winner, you won, reward, gift, free cash, congratulations]
  ar: [هدية, جائزة, ربحت, فزت, يانصيب, مكافأة, مبروك]

# Common words: reusing them in another domain is NOT impersonation of a specific organisation.
generic_labels: [police, housing, news, bank, media, office, health, visa, government, service, services,
  portal, online, payment, payments, pay, fines, fine, traffic, transport, water, electricity, energy, tax,
  customs, immigration, labour, labor, court, courts, ministry, authority, council, education, school,
  university, hospital, post, mail, login, secure, account, support, info, official, national, federal,
  emirates, arabia, gulf, dubai, abudhabi, sharjah]

# Government zones: hosts here are authenticated ONLY through the official registry; popularity
# (the Tranco reputation path) never makes them SAFE.
government_zones: [gov.ae, mil.ae, abudhabi, dubai, gov, mil]

# Letters from other alphabets that look like Latin letters (homograph detection).
confusables:
  "а": "a"
  "е": "e"
  "о": "o"
  "р": "p"
  "с": "c"
  "у": "y"
  "х": "x"
  "і": "i"
  "ѕ": "s"
  "ԁ": "d"
  "ց": "g"
  "һ": "h"
  "ј": "j"
  "ԛ": "q"
  "т": "t"
  "ν": "v"
  "ο": "o"
  "α": "a"
  "ρ": "p"
  "τ": "t"
  "ε": "e"
  "χ": "x"
  "κ": "k"
  "μ": "m"
