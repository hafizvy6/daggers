# Fallback multi-label suffixes — used ONLY if the Public Suffix List cannot be loaded.
fallback_multi_suffixes: [co.ae, com.ae, net.ae, org.ae, gov.ae, ac.ae, sch.ae, co.uk, org.uk, gov.uk, ac.uk, com.au, net.au, co.nz, com.sa, com.qa, com.kw, com.bh, com.om, com.eg, com.jo, com.tr, com.br, com.mx, com.sg, com.my, com.ph, com.pk, com.hk, com.cn, com.tw, co.jp, co.kr, co.in, co.id, co.th, co.za, com.ua, com.ru, com.pl, com.es, com.pt]

# Form field names / placeholders that reveal what a page collects (page inspection, markup only).
# Regular expressions, case-insensitive; matched against name, id, placeholder, autocomplete, aria-label.
form_fields:
  otp: ['otp', 'one.?time', 'verification.?code', 'sms.?code', 'pin\b', 'passcode', 'رمز']
  card: ['card.?(num|no)', 'cc.?(num|number)', 'cvv', 'cvc', 'csc', 'expir', 'exp.?(date|month|year)', 'cardholder']
  iban: ['iban', 'account.?(num|no)']
  identity: ['emirates.?id', 'eid\b', 'passport', 'national.?id', 'هوية']

# Established-website SAFE path (non-government sites that are neither in the registry nor in the
# worldwide ranking). SAFE only when ALL of these hold — age is one factor, never enough on its own:
#  * age: RDAP registration ≥ min_registration_age_days, OR — only when the registry publishes no RDAP
#    registration date (e.g. .ae) — HTTPS in use (Certificate Transparency) ≥ min_in_use_days.
#    A known but YOUNG registration date always wins over an old certificate history (re-registered
#    expired domains keep the old certificates);
#  * the page was retrieved over HTTPS and did not redirect to another site;
#  * no threat-feed listing for the URL or host;
#  * no warning sign at all, except the purely structural ones listed in allowed_signals;
#  * not a government zone, not a shared platform, not a government registry organisation.
established_site:
  min_registration_age_days: 730
  min_in_use_days: 1095
  rdap_statuses_allowing_in_use_history: [no_rdap_service, no_registration_event]
  allowed_signals: [lexical.path_depth]
